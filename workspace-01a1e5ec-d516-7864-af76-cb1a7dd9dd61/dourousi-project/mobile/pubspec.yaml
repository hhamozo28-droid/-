name: dourousi_mobile
description: "Dourousi (دروسي) - Secure Algerian Vocational Training Platform with OTP Auth (+213) & Strict In-App AES-256 DRM Vault."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Routing (with Deep Links)
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  app_links: ^6.3.3

  # Networking & Connectivity
  dio: ^5.7.0
  crypto: ^3.0.6

  # Security, Keychain/Keystore, AES-256-GCM DRM & Biometrics
  flutter_secure_storage: ^9.2.2
  cryptography: ^2.7.0
  local_auth: ^2.3.0

  # Local Offline SQLite Cache & Sandbox File Paths
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Strict In-App Viewers (PDF, DOCX XML, ZIP Archive) - NO external app export!
  pdfrx: ^1.0.94
  archive: ^4.0.2
  xml: ^6.5.0

  # Push Notifications (FCM) & Local Alerts
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  flutter_local_notifications: ^18.0.1

  # UI & Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/ar.json
    - assets/translations/fr.json
    - assets/translations/en.json
